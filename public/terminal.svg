  <path d="M22 8 Q25 12 22 16" stroke="#a0aec0" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M24 6 Q28 12 24 18" stroke="#a0aec0" stroke-width="1.5" fill="none" opacity="0.3"/>
  
